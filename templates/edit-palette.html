{% extends "base.html" %}
{% load static %}
{% block content %}
<header class="header-title">
    <h2>Edit Palette</h2>
    <p>Update the color scheme for<br>{{ object }}.</p>
</header>
<section>
    <form action="{% url 'edit-palette' object.pk %}" method="post">
        {% csrf_token %}
        {% for field in form %}
            <div>
                {{ field }}
                {% if field.errors %}
                    <p class="form-error">{{ field.errors.as_text }}</p>
                {% endif %}
            </div>
        {% endfor %}
        <div class="edit-palette">
            <button><a href="{% url 'generate_gradient' %}">Cancel</a></button>
            <button>Update</button>
        </div>
    </form>
</section>
{% endblock %}
